name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install host tools
        run: |
          python -m pip install clang-format==18.1.8
          clang-format --version
      - name: Format check
        run: |
          find main diagnostics/mosaico_uac components/mybot_platform components/mybot_stack/aosl/s31_port tests/aosl_s31_tasks tests/host_support tests/mosaico_display tests/mosaico_hardware tests/mosaico_usb tests/mosaico_usb_audio \
            tests/codec_audio tests/mosaico_input tests/platform_network tests/bootstrap_main tests/pcm_playback_buffer tests/media_pause \
            tests/conversation_http_trace tests/http_time_sync tests/translation_http tests/translation_ui tests/translation_client \
            tests/translation_lifecycle tests/translation_rtc tests/translation_control tests/translation_state tests/translation_volume tests/translation_captions tests/kv_store tests/storage_init tests/factory_reset \
            -path '*/mybot_stack/agora_rtc' -prune -o \
            -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' \) \
            -exec clang-format --dry-run --Werror {} +
      - name: Translation SDK format and SPDX
        run: |
          sdk=components/mybot_stack/mybot_sdk/mybot
          for file in "$sdk/include/mybot/mybot.h" "$sdk/include/mybot/platform/mybot_key.h" \
            "$sdk/include/mybot/platform/mybot_lcd.h" \
            "$sdk/include/mybot/platform/mybot_audio.h" "$sdk/include/mybot/platform/mybot_platform.h" \
            "$sdk/src/platform/mybot_platform.c" \
            "$sdk/src/core/mybot_app.c" "$sdk/src/core/mybot_device_lifecycle.c" \
            "$sdk/src/core/mybot_presenter.c" "$sdk/src/core/mybot_state_model.c" \
            "$sdk/src/service/mybot_device_client.c" "$sdk/src/rtc/mybot_agora_rtc.c" \
            "$sdk/src/internal/mybot_device_client.h" "$sdk/src/internal/mybot_device_lifecycle.h" \
            "$sdk/src/internal/mybot_device_state.h" "$sdk/src/internal/mybot_presenter.h" \
            "$sdk/src/internal/mybot_agora_rtc.h" "$sdk/src/support/mybot_http_client.c" \
            "$sdk/src/internal/mybot_http_client.h" "$sdk/src/media/mybot_media_pipeline.c" \
            "$sdk/src/internal/mybot_media_pipeline.h" "$sdk/include/mybot/mybot_ui.h" \
            "$sdk/src/core/mybot_ui.c" "$sdk/include/mybot/mybot_captions.h" \
            "$sdk/src/internal/mybot_captions.h" "$sdk/src/core/mybot_captions.c" \
            "$sdk/include/mybot/mybot_translation.h"; do
            clang-format --dry-run --Werror "$file"
            head -n 5 "$file" | grep -q 'SPDX-License-Identifier:'
          done
      - name: Wi-Fi manager format and SPDX
        run: |
          files=(components/esp-wifi-connect/wifi_manager.cc components/esp-wifi-connect/include/wifi_manager.h)
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find tests/wifi_manager -type f \( -name '*.h' -o -name '*.cc' \) -print0)
          clang-format --dry-run --Werror "${files[@]}"
          for file in "${files[@]}"; do
            head -n 5 "$file" | grep -q 'SPDX-License-Identifier:'
          done
      - name: Whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --format= --check "$HEAD_SHA"
          fi
      - name: SPDX check
        run: |
          find main diagnostics/mosaico_uac components/mybot_platform components/mybot_stack/aosl/s31_port tests/aosl_s31_tasks tests/host_support tests/mosaico_display tests/mosaico_hardware tests/mosaico_usb tests/mosaico_usb_audio \
            tests/codec_audio tests/mosaico_input tests/platform_network tests/bootstrap_main tests/pcm_playback_buffer tests/media_pause \
            tests/conversation_http_trace tests/http_time_sync tests/translation_http tests/translation_ui tests/translation_client \
            tests/translation_lifecycle tests/translation_rtc tests/translation_control tests/translation_state tests/translation_volume tests/translation_captions tests/kv_store tests/storage_init tests/factory_reset \
            -path '*/mybot_stack/agora_rtc' -prune -o -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' \) \
            -print0 | while IFS= read -r -d '' file; do
              head -n 5 "$file" | grep -q 'SPDX-License-Identifier:' || {
                echo "missing SPDX header: $file" >&2
                exit 1
              }
            done
      - name: S31 display and touch host lifecycle tests
        run: |
          sh tests/mosaico_display/run.sh
          sh tests/mosaico_input/run.sh
          sh tests/translation_ui/run.sh
      - name: S31 AOSL task allocation and deletion tests
        run: sh tests/aosl_s31_tasks/run.sh
      - name: Mosaico hardware revision and power initialization tests
        run: sh tests/mosaico_hardware/run.sh
      - name: Mosaico codec audio lifecycle tests
        run: sh tests/codec_audio/run.sh
      - name: Network and application bootstrap lifecycle tests
        run: |
          sh tests/wifi_manager/run.sh
          sh tests/platform_network/run.sh
          sh tests/bootstrap_main/run.sh
      - name: Translation protocol, lifecycle and RTC ownership tests
        run: |
          sh tests/translation_http/run.sh
          sh tests/translation_client/run.sh
          sh tests/translation_lifecycle/run.sh
          sh tests/translation_rtc/run.sh
          sh tests/translation_captions/run.sh
          sh tests/translation_control/run.sh
          sh tests/translation_state/run.sh
          sh tests/translation_volume/run.sh
      - name: HTTPS body logging and initial UTC tests
        run: |
          sh tests/conversation_http_trace/run.sh
          sh tests/http_time_sync/run.sh
      - name: NVS persistence diagnostics host tests
        run: |
          sh tests/kv_store/run.sh
          sh tests/storage_init/run.sh
          sh tests/factory_reset/run.sh
      - name: Mosaico composite audio transport host tests
        env:
          TEST_SANITIZE_FLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: |
          sh tests/mosaico_usb/run_init.sh
          sh tests/mosaico_usb_audio/run.sh
      - name: Shared PCM playback buffer lifecycle regression tests
        run: |
          sh tests/pcm_playback_buffer/run.sh
          sh tests/media_pause/run.sh
      - name: Board capabilities, safe cleanup and firmware delivery regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/build_all -p 'test_*.py' -v
      - name: Record CI scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Source formatting, SPDX and host lifecycle tests run on every push and pull request.
          Chinese and English Local AEC firmware and Chinese Cloud AEC firmware build using the pinned bundled RTSA library.
          Artifacts identify their AEC mode and contain the merged image, checksums, manifest, flash instructions and dependency license texts. These checks do not run on hardware.
          SUMMARY

  idf-build:
    name: idf-6.1-esp-mosaico-v1.2-${{ matrix.language }}-aec-${{ matrix.aec_mode }}-ptime60-no-video
    needs: quality
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.1
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: zh-CN
            aec_mode: local
          - language: en-US
            aec_mode: local
          - language: zh-CN
            aec_mode: cloud
    steps:
      - uses: actions/checkout@v4
      - name: Allow Git access to checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
      - name: Install prompt conversion prerequisite
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sed -i \
                -e 's|http://archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|http://security\.ubuntu\.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
      - name: Verify bundled S31 RTSA fingerprints
        run: python3 scripts/check_s31_build.py --vendor-only
      - name: Verify toolchain
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          test "$(idf.py --preview --version)" = "ESP-IDF v6.1"
      - name: Build and package translation firmware
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          python3 scripts/build_all.py --language "${{ matrix.language }}" \
            --aec-mode "${{ matrix.aec_mode }}" \
            --build-root "$RUNNER_TEMP/mybot-build" \
            --output-root "$GITHUB_WORKSPACE/releases"
      - name: Verify composite descriptors against pinned USB headers
        run: sh tests/mosaico_usb/run_descriptors.sh
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: mybot-esp-mosaico-v1.2-${{ matrix.language }}-aec-${{ matrix.aec_mode }}-ptime60-no-video-${{ github.sha }}
          if-no-files-found: error
          path: |
            releases/esp-mosaico-v1.2-${{ matrix.language }}.bin
            releases/esp-mosaico-v1.2-${{ matrix.language }}.manifest.json
            releases/esp-mosaico-v1.2-${{ matrix.language }}.sha256
            releases/esp-mosaico-v1.2-${{ matrix.language }}.flash.txt
            releases/esp-mosaico-v1.2-${{ matrix.language }}.licenses.txt
